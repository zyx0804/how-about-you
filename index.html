<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>How about you</title>
    <!-- Open-licensed fonts, a different set for each mood (see style.css). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The first view needs only these two, so only they hold up the page. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Syne:wght@600;800&amp;display=swap" />
    <!-- The mood fonts and the Chinese ones (with them the font stylesheet was
         329 KB) load without holding up the page; until they arrive, Chinese
         text uses the system's own Chinese font. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&amp;family=Cormorant+Garamond:ital,wght@1,300;1,500&amp;family=EB+Garamond:ital,wght@0,400;1,400&amp;family=Fredoka:wght@500;700&amp;family=Long+Cang&amp;family=Ma+Shan+Zheng&amp;family=Luckiest+Guy&amp;family=Mochiy+Pop+P+One&amp;family=Noto+Sans+SC:wght@300;400;700&amp;family=Noto+Serif+SC:wght@300;500&amp;family=Permanent+Marker&amp;family=Rubik+Bubbles&amp;family=Rubik+Burned&amp;family=Rubik+Puddles&amp;family=Sniglet:wght@800&amp;family=ZCOOL+KuaiLe&amp;family=ZCOOL+QingKe+HuangYou&amp;family=ZCOOL+XiaoWei&amp;display=swap" media="print" onload="this.media='all'" data-fonts="later" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&amp;family=Cormorant+Garamond:ital,wght@1,300;1,500&amp;family=EB+Garamond:ital,wght@0,400;1,400&amp;family=Fredoka:wght@500;700&amp;family=Long+Cang&amp;family=Ma+Shan+Zheng&amp;family=Luckiest+Guy&amp;family=Mochiy+Pop+P+One&amp;family=Noto+Sans+SC:wght@300;400;700&amp;family=Noto+Serif+SC:wght@300;500&amp;family=Permanent+Marker&amp;family=Rubik+Bubbles&amp;family=Rubik+Burned&amp;family=Rubik+Puddles&amp;family=Sniglet:wght@800&amp;family=ZCOOL+KuaiLe&amp;family=ZCOOL+QingKe+HuangYou&amp;family=ZCOOL+XiaoWei&amp;display=swap" /></noscript>
    <link rel="stylesheet" href="style.css?v=776b122" />
  </head>
  <body>
    <!-- Two background layers that crossfade when the mood changes. -->
    <div id="sky-a" class="sky-layer" aria-hidden="true"></div>
    <div id="sky-b" class="sky-layer" aria-hidden="true"></div>
    <canvas id="scene" aria-hidden="true"></canvas>
    <!-- Noise filters that turn soft ellipses into fluffy cloud layers, and a soft glow for dandelion fluff. -->
    <svg id="cloud-filters" class="filter-defs" aria-hidden="true">
      <filter id="cloud-shadow" x="-50%" y="-50%" width="200%" height="200%">
        <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="4" seed="2" />
        <feDisplacementMap in="SourceGraphic" scale="50" />
        <feGaussianBlur stdDeviation="6" />
      </filter>
      <filter id="cloud-body" x="-50%" y="-50%" width="200%" height="200%">
        <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="4" seed="7" />
        <feDisplacementMap in="SourceGraphic" scale="42" />
        <feGaussianBlur stdDeviation="3" />
      </filter>
      <filter id="cloud-light" x="-50%" y="-50%" width="200%" height="200%">
        <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="11" />
        <feDisplacementMap in="SourceGraphic" scale="32" />
        <feGaussianBlur stdDeviation="5" />
      </filter>
      <filter id="fluff-glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="0.7" result="soft" />
        <feMerge>
          <feMergeNode in="soft" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </svg>
    <!-- A small dandelion in the corner on happy days. -->
    <svg class="dandelion" viewBox="0 0 90 150" aria-hidden="true">
      <path d="M45,150 C30,138 14,140 6,128 C20,130 28,126 36,134 C26,120 22,110 26,98 C34,112 40,124 45,150 Z" fill="#5e9a4a" />
      <path d="M45,150 C58,136 74,138 84,124 C70,128 62,124 54,132 C64,118 68,108 64,96 C56,110 50,122 45,150 Z" fill="#6aaa54" />
      <defs>
        <radialGradient id="dandelion-halo">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0.45" />
          <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
      </defs>
      <g class="dandelion-sway">
        <path d="M45,150 C44,110 48,80 45,40" fill="none" stroke="#7aa760" stroke-width="2.2" />
        <circle cx="45" cy="38" r="20" fill="url(#dandelion-halo)" />
        <g id="dandelion-head" filter="url(#fluff-glow)"></g>
        <circle cx="45" cy="38" r="3" fill="#c9b27a" />
      </g>
    </svg>
    <main>
      <header>
        <div class="title-row">
          <h1 aria-label="How about you">How about you</h1>
          <button id="language-button" type="button" class="language-button">EN</button>
        </div>
        <p class="subtitle" data-i18n="subtitle"></p>
      </header>

      <p class="step-label" data-i18n="step1"></p>
      <p class="step-hint" data-i18n="step1Hint"></p>
      <!-- On a return visit: today's mood again in one tap, or the last one recorded. -->
      <p id="log-reminder" class="log-reminder" hidden>
        <span id="log-reminder-text"></span>
        <button id="log-resume" type="button" class="ask-chip" data-i18n="logResume" hidden></button>
      </p>
      <form id="feeling-form">
        <label for="feeling-input" data-i18n="feelingLabel"></label>
        <div class="input-row">
          <input id="feeling-input" type="text" maxlength="100" data-i18n-placeholder="feelingPlaceholder" />
          <button id="feeling-submit" type="submit" data-i18n="submit"></button>
        </div>
        <p id="ai-note" class="ai-note" data-i18n="aiNote" hidden></p>
      </form>
      <p id="ai-reply" class="ai-reply" aria-live="polite" hidden></p>

      <div class="meter">
        <div class="meter-header">
          <label for="mood-meter" data-i18n="meterLabel"></label>
          <output id="mood-meter-value" for="mood-meter" class="meter-value"></output>
        </div>
        <input id="mood-meter" type="range" min="0" max="100" step="1" value="50" />
        <div id="meter-labels" class="meter-labels" aria-hidden="true"></div>
        <p class="meter-help" data-i18n="meterHelp"></p>
      </div>

      <details id="calculator" class="calculator">
        <summary data-i18n="calcTitle"></summary>
        <div id="calc-questions" class="calc-questions"></div>
        <div class="calc-result">
          <output id="calc-score" class="calc-score"></output>
          <button id="calc-apply" type="button" data-i18n="calcApply"></button>
          <p id="calc-reason" class="calc-reason"></p>
        </div>
      </details>

      <!-- Interest search: pieces from every mood, found by what you're into. -->
      <details id="search" class="calculator search">
        <summary data-i18n="searchTitle"></summary>
        <form id="search-form" class="input-row search-form" role="search">
          <label for="search-input" class="visually-hidden" data-i18n="searchLabel"></label>
          <input id="search-input" type="search" maxlength="60" autocomplete="off" data-i18n-placeholder="searchPlaceholder" />
          <button id="search-submit" type="submit" data-i18n="searchSend"></button>
        </form>
        <div id="search-examples" class="ask-suggestions search-examples"></div>
        <p id="search-status" class="search-status" role="status"></p>
        <div id="search-results" class="search-results"></div>
      </details>

      <!-- Pieces the visitor saved with ♡, kept in this browser only. -->
      <details id="saved" class="calculator saved">
        <summary id="saved-title"></summary>
        <p id="saved-status" class="search-status" role="status"></p>
        <div id="saved-list" class="search-results"></div>
        <section id="saved-outfit" class="saved-outfit" hidden>
          <h3 data-i18n="savedOutfitTitle"></h3>
          <p class="search-status" data-i18n="savedOutfitHint"></p>
          <div id="saved-outfit-list" class="search-results"></div>
        </section>
      </details>

      <!-- The last mood chosen each day, kept in this browser only. -->
      <details id="mood-log" class="calculator mood-log">
        <summary data-i18n="logTitle"></summary>
        <p id="log-summary" class="search-status" role="status"></p>
        <ol id="log-days" class="log-days"></ol>
        <button id="log-clear" type="button" class="ask-chip log-clear" data-i18n="logClear" hidden></button>
      </details>

      <p id="message" class="message" role="alert" hidden></p>

      <section id="today" class="today" hidden>
        <p class="step-label" data-i18n="step2"></p>
        <p id="mood-title" class="mood-title"></p>
        <p id="hint" class="hint"></p>
        <p class="weather-line"><span id="weather-text"></span><button id="weather-button" class="weather-button" type="button" hidden></button></p>
        <p id="weather-problem" class="weather-problem" role="status" hidden></p>
        <div id="floater-stage" class="floater-stage"></div>
      </section>

      <article id="result" class="result" tabindex="-1" hidden>
        <p class="step-label" data-i18n="step3"></p>
        <p class="step-hint" data-i18n="step3Hint"></p>
        <header class="brand-header">
          <div id="brand-logo" class="brand-logo"></div>
          <p id="designer-name" class="designer-line"></p>
          <p id="logo-credit" class="logo-credit" hidden></p>
        </header>

        <figure id="photo" class="photo" hidden>
          <img id="photo-image" alt="" />
          <figcaption>
            <span id="photo-kind" class="photo-kind"></span>
            <span id="photo-caption"></span>
            <span class="photo-credit">
              <a id="photo-author" target="_blank" rel="noopener noreferrer"></a> ·
              <a id="photo-license" target="_blank" rel="noopener noreferrer"></a>
            </span>
          </figcaption>
        </figure>

        <section>
          <h3 data-i18n="story"></h3>
          <p id="story"></p>
        </section>
        <section>
          <h3 data-i18n="moodLink"></h3>
          <p id="mood-link"></p>
        </section>
        <section>
          <h3 data-i18n="brandItems"></h3>
          <div id="item-grid" class="item-grid"></div>
        </section>
        <section id="ask-section" hidden>
          <h3 data-i18n="askTitle"></h3>
          <div id="ask-suggestions" class="ask-suggestions"></div>
          <form id="ask-form" class="ask-form">
            <input id="ask-input" type="text" maxlength="200" data-i18n-placeholder="askPlaceholder" />
            <button type="submit" data-i18n="askSend"></button>
          </form>
          <p id="ask-answer" class="ask-answer" aria-live="polite" hidden></p>
        </section>
        <section id="feedback-section" hidden>
          <h3 data-i18n="feedbackTitle"></h3>
          <form id="feedback-form" class="ask-form">
            <input id="feedback-input" type="text" maxlength="300" data-i18n-placeholder="feedbackPlaceholder" />
            <button type="submit" data-i18n="feedbackSend"></button>
          </form>
          <p id="feedback-status" class="ask-answer" aria-live="polite" hidden></p>
        </section>
        <p class="note" data-i18n="note"></p>
      </article>
      <!-- Shown once the page is scrolled down, to jump back to the top. -->
      <button id="back-to-top" type="button" class="back-to-top" data-i18n="backToTop" hidden></button>
    </main>

    <script src="src/moods.js?v=776b122"></script>
    <script src="src/data/sad.js?v=776b122"></script>
    <script src="src/data/irritated.js?v=776b122"></script>
    <script src="src/data/tired.js?v=776b122"></script>
    <script src="src/data/calm.js?v=776b122"></script>
    <script src="src/data/excited.js?v=776b122"></script>
    <script src="src/data/happy.js?v=776b122"></script>
    <script src="src/data/ai-images.js?v=776b122"></script>
    <script src="src/i18n.js?v=776b122"></script>
    <script src="src/contrast.js?v=776b122"></script>
    <script src="src/weather.js?v=776b122"></script>
    <script src="src/styling.js?v=776b122"></script>
    <script src="src/recommend.js?v=776b122"></script>
    <script src="src/search.js?v=776b122"></script>
    <script src="src/favorites.js?v=776b122"></script>
    <script src="src/mood-log.js?v=776b122"></script>
    <script src="src/flats.js?v=776b122"></script>
    <script src="src/brand-looks.js?v=776b122"></script>
    <script src="src/ai.js?v=776b122"></script>
    <script src="src/scene.js?v=776b122"></script>
    <script src="src/dandelion.js?v=776b122"></script>
    <script src="src/floaters.js?v=776b122"></script>
    <script src="src/app.js?v=776b122"></script>
  </body>
</html>
