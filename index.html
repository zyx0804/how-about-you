<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>How about you</title>
    <!-- Open-licensed fonts, a different set for each mood (see style.css). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&amp;family=Cormorant+Garamond:ital,wght@1,300;1,500&amp;family=EB+Garamond:ital,wght@0,400;1,400&amp;family=Fredoka:wght@500;700&amp;family=Long+Cang&amp;family=Ma+Shan+Zheng&amp;family=Monoton&amp;family=Noto+Sans+SC:wght@300;400;700&amp;family=Noto+Serif+SC:wght@300;500&amp;family=Permanent+Marker&amp;family=Rubik+Burned&amp;family=Rubik+Puddles&amp;family=Sniglet:wght@800&amp;family=Syne:wght@600;800&amp;family=ZCOOL+KuaiLe&amp;family=ZCOOL+QingKe+HuangYou&amp;family=ZCOOL+XiaoWei&amp;display=swap" />
    <link rel="stylesheet" href="style.css?v=af2dc15" />
  </head>
  <body>
    <!-- Two background layers that crossfade when the mood changes. -->
    <div id="sky-a" class="sky-layer" aria-hidden="true"></div>
    <div id="sky-b" class="sky-layer" aria-hidden="true"></div>
    <canvas id="scene" aria-hidden="true"></canvas>
    <!-- Noise filters that turn soft ellipses into fluffy cloud layers, and a soft glow for dandelion fluff. -->
    <svg id="cloud-filters" class="filter-defs" aria-hidden="true">
      <filter id="cloud-shadow" x="-50%" y="-50%" width="200%" height="200%">
        <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="4" seed="2" />
        <feDisplacementMap in="SourceGraphic" scale="50" />
        <feGaussianBlur stdDeviation="6" />
      </filter>
      <filter id="cloud-body" x="-50%" y="-50%" width="200%" height="200%">
        <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="4" seed="7" />
        <feDisplacementMap in="SourceGraphic" scale="42" />
        <feGaussianBlur stdDeviation="3" />
      </filter>
      <filter id="cloud-light" x="-50%" y="-50%" width="200%" height="200%">
        <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="11" />
        <feDisplacementMap in="SourceGraphic" scale="32" />
        <feGaussianBlur stdDeviation="5" />
      </filter>
      <filter id="fluff-glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="0.7" result="soft" />
        <feMerge>
          <feMergeNode in="soft" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </svg>
    <!-- A small dandelion in the corner on happy days. -->
    <svg class="dandelion" viewBox="0 0 90 150" aria-hidden="true">
      <path d="M45,150 C30,138 14,140 6,128 C20,130 28,126 36,134 C26,120 22,110 26,98 C34,112 40,124 45,150 Z" fill="#5e9a4a" />
      <path d="M45,150 C58,136 74,138 84,124 C70,128 62,124 54,132 C64,118 68,108 64,96 C56,110 50,122 45,150 Z" fill="#6aaa54" />
      <defs>
        <radialGradient id="dandelion-halo">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0.45" />
          <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
      </defs>
      <g class="dandelion-sway">
        <path d="M45,150 C44,110 48,80 45,40" fill="none" stroke="#7aa760" stroke-width="2.2" />
        <circle cx="45" cy="38" r="20" fill="url(#dandelion-halo)" />
        <g id="dandelion-head" filter="url(#fluff-glow)"></g>
        <circle cx="45" cy="38" r="3" fill="#c9b27a" />
      </g>
    </svg>
    <main>
      <header>
        <div class="title-row">
          <h1 data-i18n="title">How about you</h1>
          <button id="language-button" type="button" class="language-button">EN</button>
        </div>
        <p class="subtitle" data-i18n="subtitle"></p>
      </header>

      <form id="feeling-form">
        <label for="feeling-input" data-i18n="feelingLabel"></label>
        <div class="input-row">
          <input id="feeling-input" type="text" maxlength="100" data-i18n-placeholder="feelingPlaceholder" />
          <button id="feeling-submit" type="submit" data-i18n="submit"></button>
        </div>
        <p id="ai-note" class="ai-note" data-i18n="aiNote" hidden></p>
      </form>
      <p id="ai-reply" class="ai-reply" aria-live="polite" hidden></p>

      <div class="meter">
        <div class="meter-header">
          <label for="mood-meter" data-i18n="meterLabel"></label>
          <output id="mood-meter-value" for="mood-meter" class="meter-value"></output>
        </div>
        <input id="mood-meter" type="range" min="0" max="100" step="1" value="50" />
        <div id="meter-labels" class="meter-labels" aria-hidden="true"></div>
      </div>

      <details id="calculator" class="calculator">
        <summary data-i18n="calcTitle"></summary>
        <div id="calc-questions" class="calc-questions"></div>
        <div class="calc-result">
          <output id="calc-score" class="calc-score"></output>
          <button id="calc-apply" type="button" data-i18n="calcApply"></button>
        </div>
      </details>

      <p id="message" class="message" role="alert" hidden></p>

      <section id="today" class="today" hidden>
        <p id="mood-title" class="mood-title"></p>
        <p id="hint" class="hint"></p>
        <div id="floater-stage" class="floater-stage"></div>
      </section>

      <article id="result" class="result" hidden>
        <header class="brand-header">
          <div id="brand-logo" class="brand-logo"></div>
          <p id="designer-name" class="designer-line"></p>
          <p id="logo-credit" class="logo-credit" hidden></p>
        </header>

        <figure id="photo" class="photo" hidden>
          <img id="photo-image" alt="" />
          <figcaption>
            <span id="photo-kind" class="photo-kind"></span>
            <span id="photo-caption"></span>
            <span class="photo-credit">
              <a id="photo-author" target="_blank" rel="noopener noreferrer"></a> ·
              <a id="photo-license" target="_blank" rel="noopener noreferrer"></a>
            </span>
          </figcaption>
        </figure>

        <section>
          <h3 data-i18n="story"></h3>
          <p id="story"></p>
        </section>
        <section>
          <h3 data-i18n="moodLink"></h3>
          <p id="mood-link"></p>
        </section>
        <section>
          <h3 data-i18n="brandItems"></h3>
          <div id="item-grid" class="item-grid"></div>
        </section>
        <section id="ask-section" hidden>
          <h3 data-i18n="askTitle"></h3>
          <div id="ask-suggestions" class="ask-suggestions"></div>
          <form id="ask-form" class="ask-form">
            <input id="ask-input" type="text" maxlength="200" data-i18n-placeholder="askPlaceholder" />
            <button type="submit" data-i18n="askSend"></button>
          </form>
          <p id="ask-answer" class="ask-answer" aria-live="polite" hidden></p>
        </section>
        <p class="note" data-i18n="note"></p>
      </article>
    </main>

    <script src="src/moods.js?v=af2dc15"></script>
    <script src="src/data/sad.js?v=af2dc15"></script>
    <script src="src/data/irritated.js?v=af2dc15"></script>
    <script src="src/data/tired.js?v=af2dc15"></script>
    <script src="src/data/calm.js?v=af2dc15"></script>
    <script src="src/data/excited.js?v=af2dc15"></script>
    <script src="src/data/happy.js?v=af2dc15"></script>
    <script src="src/data/ai-images.js?v=af2dc15"></script>
    <script src="src/i18n.js?v=af2dc15"></script>
    <script src="src/recommend.js?v=af2dc15"></script>
    <script src="src/flats.js?v=af2dc15"></script>
    <script src="src/brand-looks.js?v=af2dc15"></script>
    <script src="src/ai.js?v=af2dc15"></script>
    <script src="src/scene.js?v=af2dc15"></script>
    <script src="src/dandelion.js?v=af2dc15"></script>
    <script src="src/floaters.js?v=af2dc15"></script>
    <script src="src/app.js?v=af2dc15"></script>
  </body>
</html>
